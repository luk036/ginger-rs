[package]
name = "ginger-rs"
version = "0.1.5"
edition = "2021"
description = "Parallel Bairstow Root-finding Method in Rust"
repository = "https://github.com/luk036/ginger-rs"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
doc-images = ["dep:svgbobdoc"]

[package.metadata.docs.rs]
features = ["doc-images"]
rustdoc-args = ["--html-in-header", "src/doc-header.html"]

[lib]
name = "ginger"
path = "src/lib.rs"

[dependencies]
svgbobdoc = { version = "0.3", optional = true, features = ["enable"] }
lds-rs = { version = "0.1.9", package = "lds-gen" }
num-complex = "0.4"
num-traits = "0.2.19"
rayon = "1.12.0"

[dev-dependencies]
approx_eq = "0.1.8"
criterion = "0.8.2"
proptest = "1.4"

[[bench]]
name = "benchmark"
harness = false
